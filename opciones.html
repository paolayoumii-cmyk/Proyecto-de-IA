<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlateMatch · Recomendaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="barra-sup">
    <div>
      <h1 class="marca">Plate<span>Match</span></h1>
      <p id="subtitulo">Recomendaciones personalizadas</p>
    </div>
    <nav class="navegacion" data-actual="recomendaciones"></nav>
  </header>

  <div class="cuerpo">
    <aside class="lateral" id="lateral">
      <section class="bloque" id="bloque-comensales" hidden>
        <h3>Comensales</h3>
        <div class="comensales" id="comensales"></div>
      </section>

      <section class="bloque">
        <h3>Análisis del menú</h3>
        <div class="metricas" id="metricas"></div>
      </section>

      <section class="bloque" id="bloque-descartados" hidden>
        <h3>Descartados por prohibidos</h3>
        <ul class="lista-descartados" id="descartados"></ul>
      </section>

      <div class="lateral-pie">
        <a href="eleccion.html" class="btn-secundario">Editar preferencias</a>
      </div>
    </aside>

    <main class="principal" id="contenido">
      <div class="vacio">Cargando…</div>
    </main>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/opciones.js"></script>
</body>
</html>
